name: Build Project
on:
  workflow_call:
    inputs:
      release:
        description: Build release packages (Release config, packaged) regardless of the event
        type: boolean
        default: false
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.check-event.outputs.pluginName }}
jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Event Data ☑️
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
                config_data[3]='config:Release'
              fi
              ;;
            workflow_dispatch)
              config_data=('codesign:true' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          if [[ '${{ inputs.release }}' == 'true' ]]; then
            config_data=('codesign:true' 'notarize:true' 'package:true' 'config:Release')
          fi

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

          plugin_name="$(grep 'name' buildspec.json | sed -E -e 's/^.+"name":[^"]+"(.+)",?$/\1/g')"
          plugin_display_name="$(grep 'displayName' buildspec.json | sed -E -e 's/^.+"displayName":[^"]+"(.+)",?$/\1/g' || echo "")"

          if [[ "${plugin_display_name}" ]]; then
            echo "pluginName=${plugin_display_name}" >> $GITHUB_OUTPUT
          else
            echo "pluginName=${plugin_name}" >> $GITHUB_OUTPUT
          fi

  macos-build:
    name: Build for macOS 🍏
    runs-on: macos-15
    needs: check-event
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if (( ${+RUNNER_DEBUG} )) setopt XTRACE

          print '::group::Enable Xcode 16.1'
          sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer
          print '::endgroup::'

          print '::group::Clean Homebrew Environment'
          local -a unwanted_formulas=()
          local -a remove_formulas=()
          for formula (${unwanted_formulas}) {
            if [[ -d ${HOMEBREW_PREFIX}/Cellar/${formula} ]] remove_formulas+=(${formula})
          }

          if (( #remove_formulas )) brew uninstall --ignore-dependencies ${remove_formulas}
          print '::endgroup::'

          local product_name
          local product_version
          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          print "pluginName=${product_name}" >> $GITHUB_OUTPUT
          print "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Set Up Codesigning 🔑
        uses: ./.github/actions/setup-macos-codesigning
        if: fromJSON(needs.check-event.outputs.codesign)
        id: codesign
        with:
          codesignIdentity: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          installerIdentity: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          codesignCertificate: ${{ secrets.MACOS_SIGNING_CERT }}
          certificatePassword: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          keychainPassword: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          provisioningProfile: ${{ secrets.MACOS_SIGNING_PROVISIONING_PROFILE }}
          notarizationUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          notarizationPassword: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Set Up UI 🧩
        uses: ./.github/actions/setup-ui

      - name: Build UI 🎨
        run: pnpm -C ui build

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}

      - name: Check UI In Bundle 🔍
        run: |
          : Check UI In Bundle 🔍
          local index=release/${{ needs.check-event.outputs.config }}/${{ steps.setup.outputs.pluginName }}.plugin/Contents/Resources/ui/index.html
          if [[ ! -f ${index} ]] {
            print "::error::UI missing from the plugin bundle: ${index}"
            exit 1
          }

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) && fromJSON(steps.codesign.outputs.haveCodesignIdent) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          installerIdent: ${{ steps.codesign.outputs.installerIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
          notarize: ${{ fromJSON(needs.check-event.outputs.notarize) && fromJSON(steps.codesign.outputs.haveNotarizationUser) }}
          codesignUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          codesignPass: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Check Preinstall In Package 🔍
        if: fromJSON(needs.check-event.outputs.package)
        run: |
          : Check Preinstall In Package 🔍
          local pkg=(release/*.pkg(N))
          if (( ${#pkg} == 0 )) {
            print "::error::No .pkg found in release/"
            exit 1
          }
          pkgutil --expand ${pkg[1]} ${RUNNER_TEMP}/pkg-expanded
          local script=(${RUNNER_TEMP}/pkg-expanded/*.pkg/Scripts/preinstall(N))
          if (( ${#script} == 0 )) || [[ ! -x ${script[1]} ]] {
            print "::error::preinstall missing or not executable in the pkg"
            exit 1
          }

      # package-macos emits either .pkg or .tar.xz; ship the bare bundle next to the .pkg as well
      - name: Archive Plugin Bundle 🗜️
        if: fromJSON(needs.check-event.outputs.package)
        run: |
          : Archive Plugin Bundle 🗜️
          local name=${{ steps.setup.outputs.pluginName }}
          local output=${PWD}/release/${name}-${{ steps.setup.outputs.pluginVersion }}-macos-universal.tar.xz
          pushd release/${{ needs.check-event.outputs.config }}
          XZ_OPT=-T0 tar -cJf ${output} ${name}.plugin
          popd

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal.*

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@v4
        if: ${{ needs.check-event.outputs.config == 'Release' }}
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}-dSYMs
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-dSYMs.*

      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}

  ubuntu-build:
    name: Build for Ubuntu 🐧
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    needs: check-event
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-

      - name: Set Up UI 🧩
        uses: ./.github/actions/setup-ui

      - name: Build UI 🎨
        run: pnpm -C ui build

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}

      - name: Check UI In Install Tree 🔍
        run: |
          : Check UI In Install Tree 🔍
          index="$(find "release/${{ needs.check-event.outputs.config }}" -path '*/obs-plugins/${{ steps.setup.outputs.pluginName }}/ui/index.html' -print -quit)"
          if [[ -z "${index}" ]]; then
            echo "::error::UI missing from the install tree under release/${{ needs.check-event.outputs.config }}"
            exit 1
          fi

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-sources-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-source.*

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*.*

      - name: Upload debug symbol artifacts 🪲
        uses: actions/upload-artifact@v4
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}-dbgsym
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*-dbgsym.ddeb

      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}

  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          $ProductName = $BuildSpec.name
          $ProductVersion = $BuildSpec.version

          "pluginName=${ProductName}" >> $env:GITHUB_OUTPUT
          "pluginVersion=${ProductVersion}" >> $env:GITHUB_OUTPUT

      - name: Set Up UI 🧩
        uses: ./.github/actions/setup-ui

      - name: Build UI 🎨
        run: pnpm -C ui build

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Check UI In Install Tree 🔍
        run: |
          # Check UI In Install Tree 🔍
          $Index = "release/${{ needs.check-event.outputs.config }}/${{ steps.setup.outputs.pluginName }}/data/ui/index.html"
          if ( -not (Test-Path -Path $Index -PathType Leaf) ) {
            Write-Output "::error::UI missing from the install tree: ${Index}"
            exit 1
          }

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Check UI In Package 🔍
        run: |
          # Check UI In Package 🔍
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $Name = "${{ steps.setup.outputs.pluginName }}"
          $Zip = "release/${Name}-${{ steps.setup.outputs.pluginVersion }}-windows-x64.zip"
          $Archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -Path $Zip).Path)
          $Found = $Archive.Entries | Where-Object { ($_.FullName -replace '\\', '/') -eq "${Name}/data/ui/index.html" }
          $Archive.Dispose()
          if ( -not $Found ) {
            Write-Output "::error::UI missing from the package: ${Zip}"
            exit 1
          }

      # Installs for real on the throwaway runner, so {app} mapping and uninstall cleanup are checked too
      - name: Check Installer 🔍
        run: |
          # Check Installer 🔍
          $Name = "${{ steps.setup.outputs.pluginName }}"
          $Base = "release/${Name}-${{ steps.setup.outputs.pluginVersion }}-windows-x64"
          $Installer = "${Base}-installer.exe"
          if ( -not (Test-Path -Path $Installer -PathType Leaf) ) {
            Write-Output "::error::installer missing: ${Installer}"
            exit 1
          }

          $AppDir = Join-Path $Env:ProgramData "obs-studio\plugins\${Name}"
          function Invoke-Silently([string] $Exe, [string] $LogName) {
            $Log = Join-Path $Env:RUNNER_TEMP $LogName
            $Process = Start-Process -FilePath $Exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=${Log}" -Wait -PassThru
            if ( $Process.ExitCode -ne 0 ) {
              if ( Test-Path -Path $Log ) { Get-Content -Path $Log }
              Write-Output "::error::${Exe} exited with code $($Process.ExitCode)"
              exit 1
            }
          }
          Invoke-Silently (Resolve-Path -Path $Installer).Path 'install.log'

          foreach ( $Required in @("bin\64bit\${Name}.dll", 'data\ui\index.html') ) {
            if ( -not (Test-Path -Path (Join-Path $AppDir $Required) -PathType Leaf) ) {
              Write-Output "::error::installer did not install {app}\${Required}"
              exit 1
            }
          }

          $Unzipped = Join-Path $Env:RUNNER_TEMP 'unzipped'
          Expand-Archive -Path "${Base}.zip" -DestinationPath $Unzipped -Force
          function Get-Tree([string] $Root) {
            Get-ChildItem -Path $Root -Recurse -File |
              ForEach-Object { [System.IO.Path]::GetRelativePath($Root, $_.FullName) } |
              Where-Object { $_ -notlike 'unins000.*' } |
              Sort-Object
          }
          $Diff = Compare-Object -ReferenceObject @(Get-Tree (Join-Path $Unzipped $Name)) -DifferenceObject @(Get-Tree $AppDir)
          if ( $Diff ) {
            $Diff | Format-Table -AutoSize | Out-String | Write-Output
            Write-Output "::error::installer contents differ from ${Base}.zip"
            exit 1
          }

          $Stale = Join-Path $AppDir 'data\stale.txt'
          Set-Content -Path $Stale -Value 'left by an older version'
          Invoke-Silently (Resolve-Path -Path $Installer).Path 'reinstall.log'
          if ( Test-Path -Path $Stale ) {
            Write-Output "::error::over-install left ${Stale} behind"
            exit 1
          }
          foreach ( $Uninstaller in @('unins000.exe', 'unins000.dat') ) {
            if ( -not (Test-Path -Path (Join-Path $AppDir $Uninstaller) -PathType Leaf) ) {
              Write-Output "::error::over-install lost {app}\${Uninstaller}"
              exit 1
            }
          }

          Invoke-Silently (Join-Path $AppDir 'unins000.exe') 'uninstall.log'
          $Deadline = (Get-Date).AddSeconds(60)
          while ( (Test-Path -Path $AppDir) -and ((Get-Date) -lt $Deadline) ) {
            Start-Sleep -Seconds 1
          }
          if ( Test-Path -Path $AppDir ) {
            Write-Output "::error::uninstaller left ${AppDir} behind"
            exit 1
          }

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*
